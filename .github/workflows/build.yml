name: Build binaries

on: [push,pull_request,workflow_dispatch]

jobs:
  all-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Compile & Link
      run: cmake --build build -j

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: cpm-${{ matrix.os }}
        path: ./build/cpm
